<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>WhatsApp Gateway Admin</title>
        <script>
            (function () {
                const key = 'vite-ui-theme';
                const theme = localStorage.getItem(key) || 'system';
                const root = document.documentElement;
                root.classList.remove('light', 'dark');
                if (theme === 'system') {
                    const systemTheme = window.matchMedia(
                        '(prefers-color-scheme: dark)',
                    ).matches
                        ? 'dark'
                        : 'light';
                    root.classList.add(systemTheme);
                } else {
                    root.classList.add(theme);
                }
            })();
        </script>
      <script type="module" crossorigin src="/assets/index-CBHQJBST.js"></script>
      <link rel="stylesheet" crossorigin href="/assets/index-BGAnpcFs.css">
    </head>
    <body>
        <div id="root"></div>
    </body>
</html>
